# Transrate 静的サイト共通設定
root /var/www/transrate;
index index.html;
client_max_body_size 4m;

# ONNX Runtime のマルチスレッド(SharedArrayBuffer)有効化
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header X-Content-Type-Options "nosniff" always;

gzip on;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

# HTML / Service Worker / manifest は常に最新を取得
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Service-Worker-Allowed "/" always;
}
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
}
location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
}

# ハッシュ付きアセット / ランタイム / モデルは長期キャッシュ
location ~* \.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
}
location ~* \.(js|css|wasm|onnx|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
}

# オンラインモード用 API(PHP) — Gemini はサーバー側からのみ呼び出す
location ^~ /api/ {
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 90;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 8 64k;
    }
    return 404;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~ /\. {
    deny all;
}
