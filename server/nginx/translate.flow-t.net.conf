# translate.flow-t.net — Transrate (オフライン対応 音声翻訳 PWA / 静的配信)
server {
    include /etc/nginx/snippets/security_rules.conf;
    limit_req zone=req_limit_per_ip burst=30 nodelay;
    listen 80;
    listen [::]:80;
    server_name translate.flow-t.net translate.133.18.144.38.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /etc/nginx/snippets/security_rules.conf;
    limit_req zone=req_limit_per_ip burst=100 nodelay;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name translate.flow-t.net;

    ssl_certificate /etc/letsencrypt/live/translate.flow-t.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/translate.flow-t.net/privkey.pem;

    include /etc/nginx/snippets/transrate_site.conf;
}

server {
    include /etc/nginx/snippets/security_rules.conf;
    limit_req zone=req_limit_per_ip burst=100 nodelay;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name translate.133.18.144.38.sslip.io;

    ssl_certificate /etc/letsencrypt/live/sslip_cert_part2/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sslip_cert_part2/privkey.pem;

    include /etc/nginx/snippets/transrate_site.conf;
}
